allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    version = '1.0'
    ext {
        appName = 'AerialGlide'
        gdxVersion = '1.12.1'
    }

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

subprojects {
    apply plugin: 'java'

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
